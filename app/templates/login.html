<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Bailey BarberShop</title>

  <!-- Google Fonts: Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5.3.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons 1.11.3 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    /* ── Vintage Palette ─────────────────────────────────────────────── */
    :root {
      --bb-cream:      #f4ede0;
      --bb-parchment:  #fdf8f0;
      --bb-dark:       #1c0f07;
      --bb-brown:      #3b1f0f;
      --bb-red:        #8b1a1a;
      --bb-gold:       #b8892a;
      --bb-gold-light: #d4a843;
      --bb-warm-text:  #3d2d1f;
      --bb-muted:      #7a6556;
      --bb-border:     #d4bfa8;
    }

    /* ── Base ────────────────────────────────────────────────────────── */
    body {
      background-color: var(--bb-cream);
      background-image: repeating-linear-gradient(
        135deg,
        transparent 0px, transparent 40px,
        rgba(184,137,42,.035) 40px, rgba(184,137,42,.035) 42px
      );
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--bb-warm-text);
    }

    /* ── Login card ──────────────────────────────────────────────────── */
    .login-card {
      background: var(--bb-parchment);
      border: 1px solid var(--bb-border);
      border-top: 4px solid var(--bb-gold);
      border-radius: 12px;
      padding: 2.5rem 2rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(28,15,7,.10);
    }

    /* ── Branding ────────────────────────────────────────────────────── */
    .login-brand-icon {
      font-size: 2rem;
      color: var(--bb-gold);
      display: block;
      text-align: center;
      line-height: 1;
      margin-bottom: 0.4rem;
    }
    .login-brand-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--bb-dark);
      text-align: center;
      letter-spacing: 0.02em;
      margin-bottom: 0;
    }
    .login-ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      margin: 0.55rem 0 1.6rem;
    }
    .login-ornament::before,
    .login-ornament::after {
      content: '';
      display: block;
      width: 40px;
      height: 1px;
      background: var(--bb-gold);
      opacity: 0.5;
    }
    .login-ornament span {
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--bb-muted);
    }

    /* ── Alert banner ────────────────────────────────────────────────── */
    .bb-alert {
      border-radius: 8px;
      padding: 0.75rem 0.9rem;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      font-size: 0.87rem;
      border-left: 4px solid;
    }
    .bb-alert-danger { background: #fdf0f0; border-left-color: var(--bb-red); color: #6b1414; }
    .bb-alert-icon   { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }

    /* ── Form controls ───────────────────────────────────────────────── */
    .field-wrap {
      position: relative;
      margin-bottom: 1rem;
    }
    .field-wrap .field-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      color: var(--bb-gold);
      font-size: 0.95rem;
      pointer-events: none;
    }
    .form-floating > .form-control {
      border-color: var(--bb-border);
      background: #fff;
      color: var(--bb-warm-text);
      border-radius: 10px;
      padding-left: 2.7rem;
    }
    .form-floating > .form-control:focus {
      border-color: var(--bb-gold);
      box-shadow: 0 0 0 3px rgba(184,137,42,.15);
      background: #fff;
    }
    .form-floating > .form-control::placeholder { color: transparent; }
    .form-floating > label {
      color: var(--bb-muted);
      padding-left: 2.7rem;
    }

    /* ── Submit button ───────────────────────────────────────────────── */
    .btn-login {
      background: var(--bb-brown);
      border: 2px solid var(--bb-brown);
      color: var(--bb-gold-light);
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      width: 100%;
      padding: 0.7rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }
    .btn-login:hover {
      background: var(--bb-dark);
      border-color: var(--bb-dark);
      color: var(--bb-gold);
    }

    /* ── Footer note ─────────────────────────────────────────────────── */
    .login-footer {
      margin-top: 1.5rem;
      font-size: 0.68rem;
      color: var(--bb-muted);
      text-align: center;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="login-card">

    <!-- Branding -->
    <span class="login-brand-icon">✂</span>
    <div class="login-brand-name">Bailey BarberShop</div>
    <div class="login-ornament"><span>Acceso a Calendario</span></div>

    <!-- Error banner -->
    {% if error == "invalid_credentials" %}
    <div class="bb-alert bb-alert-danger" role="alert">
      <i class="bi bi-x-circle-fill bb-alert-icon"></i>
      <span data-i18n="error-login">Correo o contraseña incorrectos.</span>
    </div>
    {% endif %}

    <!-- Login form -->
    <form method="post" action="/auth/login">

      <div class="field-wrap">
        <i class="bi bi-envelope field-icon"></i>
        <div class="form-floating">
          <input type="email" class="form-control" id="email" name="email"
                 placeholder="Email" autocomplete="email" required />
          <label for="email" data-i18n="label-email">Correo Electrónico</label>
        </div>
      </div>

      <div class="field-wrap">
        <i class="bi bi-lock field-icon"></i>
        <div class="form-floating">
          <input type="password" class="form-control" id="password" name="password"
                 placeholder="Password" autocomplete="current-password" required />
          <label for="password" data-i18n="label-password">Contraseña</label>
        </div>
      </div>

      <button type="submit" class="btn-login" data-i18n="btn-login">Iniciar sesión</button>

    </form>

  </div>

  <div class="login-footer">Bailey BarberShop · Acceso solo para administrador</div>

<script>
  const I18N_ES = {
    'error-login':    'Correo o contraseña incorrectos.',
    'label-email':    'Correo electrónico',
    'label-password': 'Contraseña',
    'btn-login':      'Iniciar sesión',
  };

  function applyLang(lang) {
    const map = lang === 'es' ? I18N_ES : {};
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const en = el.dataset.i18nEn ?? el.textContent.trim();
      el.dataset.i18nEn = en;
      el.textContent = lang === 'es' ? (map[el.dataset.i18n] ?? en) : en;
    });
    document.documentElement.lang = lang;
  }

  document.querySelectorAll('[data-i18n]').forEach(el => { el.dataset.i18nEn = el.textContent.trim(); });
  applyLang(localStorage.getItem('lang') || 'en');
</script>

</body>
</html>
